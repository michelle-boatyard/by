<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Editor — Boatyard Sales</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', system-ui, sans-serif;
    background: #0f2a38;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }

  /* ── Modal ── */
  .modal {
    background: #fff;
    border-radius: 16px;
    width: 780px;
    max-width: 100%;
    box-shadow: 0 24px 64px rgba(15,42,56,0.35);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px; border-bottom: 1px solid #e2ebf3;
  }
  .modal-header-left { display: flex; align-items: center; gap: 10px; }
  .modal-title { font-size: 15px; font-weight: 600; color: #1E293B; }
  .modal-header-right { display: flex; align-items: center; gap: 10px; }
  .ai-badge {
    font-size: 11px; font-weight: 500; color: #7b8ba3;
    background: #f1f5f9; border-radius: 20px; padding: 3px 11px;
  }
  .close-btn {
    background: none; border: none; cursor: pointer; padding: 4px;
    border-radius: 6px; display: flex; align-items: center; transition: background 0.15s;
  }
  .close-btn:hover { background: #f1f5f9; }

  /* ── Body ── */
  .modal-body { display: flex; flex: 1; min-height: 0; }

  /* ── Left panel ── */
  .panel-left {
    width: 180px; min-width: 180px;
    border-right: 1px solid #e2ebf3;
    padding: 16px 12px;
    display: flex; flex-direction: column;
  }
  .section-label {
    font-size: 10px; font-weight: 600; color: #9aa8bc;
    letter-spacing: 0.08em; text-transform: uppercase;
    display: block; margin-bottom: 8px;
  }
  .bg-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 8px; border-radius: 8px; cursor: pointer;
    border: 1.5px solid transparent; background: transparent;
    font-family: inherit; width: 100%; text-align: left;
    margin-bottom: 3px; transition: border-color 0.12s, background 0.12s;
  }
  .bg-btn.active { border-color: #20667E; background: #f3f9fc; }
  .bg-btn.active .bg-label { color: #20667E; font-weight: 600; }
  .bg-swatch { width: 22px; height: 15px; border-radius: 3px; flex-shrink: 0; }
  .bg-label { font-size: 11px; font-weight: 500; color: #334155; }

  /* ── Right panel ── */
  .panel-right {
    flex: 1; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }

  /* Split preview */
  .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preview-col { display: flex; flex-direction: column; gap: 5px; }
  .preview-col-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .preview-col-label.before { color: #9aa8bc; }
  .preview-col-label.after  { color: #20667E; }
  .preview-img {
    border-radius: 10px; overflow: hidden; aspect-ratio: 4/3;
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-in; position: relative; transition: background 0.2s;
  }
  .expand-hint {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(30,41,59,0.45); border-radius: 5px;
    padding: 2px 8px; font-size: 9px; font-weight: 500; color: #fff;
  }

  /* Regen */
  .regen-box {
    background: #f8f9fb; border-radius: 10px;
    padding: 10px 13px; border: 1px solid #e2ebf3;
  }
  .regen-header { display: flex; align-items: center; justify-content: space-between; }
  .regen-title { font-size: 12px; font-weight: 600; color: #334155; }
  .regen-trigger {
    font-size: 11px; font-weight: 500; color: #20667E;
    background: none; border: none; cursor: pointer;
    font-family: inherit; display: flex; align-items: center; gap: 4px;
    padding: 0; transition: opacity 0.15s;
  }
  .regen-trigger:hover { opacity: 0.75; }
  .regen-body { display: none; margin-top: 8px; }
  .regen-textarea {
    width: 100%; border: 1px solid #d3dce8; border-radius: 8px;
    padding: 8px 10px; font-size: 12px; font-family: inherit;
    color: #1E293B; background: #fff; resize: none;
    box-sizing: border-box; outline: none; line-height: 1.5;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .regen-textarea:focus {
    border-color: #20667E;
    box-shadow: 0 0 0 2px rgba(32,102,126,0.12);
  }
  .regen-apply {
    margin-top: 6px; width: 100%;
    background: #20667E; color: #fff; border: none;
    border-radius: 8px; padding: 8px 0;
    font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background 0.15s;
  }
  .regen-apply:hover { background: #1c586d; }
  .regen-hint { font-size: 11px; color: #9aa8bc; margin: 4px 0 0 0; }

  /* ── Footer ── */
  .modal-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 22px; border-top: 1px solid #e2ebf3;
  }
  .btn {
    padding: 7px 14px; border-radius: 9px; font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: inherit; border: 1px solid #d3dce8;
    background: #f8f9fb; color: #475569;
    display: flex; align-items: center; gap: 6px; transition: background 0.15s;
  }
  .btn:hover { background: #e2ebf3; }
  .btn-primary {
    background: #20667E; color: #fff;
    border-color: #20667E; font-weight: 600;
  }
  .btn-primary:hover { background: #1c586d; border-color: #1c586d; }

  /* ── Zoom overlay ── */
  .zoom-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(15,42,56,0.93); z-index: 9999;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .zoom-topbar {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; position: absolute; top: 0; left: 0;
  }
  .zoom-pill {
    background: rgba(255,255,255,0.1); border-radius: 10px;
    padding: 4px; display: flex; gap: 3px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .zoom-pill-btn {
    padding: 6px 20px; border-radius: 7px; border: none;
    font-size: 12px; cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .zoom-pill-btn.zactive {
    background: #fff; color: #1E293B; font-weight: 600;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .zoom-pill-btn.zinactive {
    background: transparent; color: rgba(255,255,255,0.5); font-weight: 500;
  }
  .zoom-filename { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.65); }
  .zoom-close {
    background: rgba(255,255,255,0.1); border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 12px; font-weight: 500; color: #fff;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 6px; transition: background 0.15s;
  }
  .zoom-close:hover { background: rgba(255,255,255,0.2); }
  .zoom-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, opacity 0.2s;
  }
  .zoom-arrow:hover { background: rgba(255,255,255,0.22); }
  .zoom-arrow.left  { left: 24px; }
  .zoom-arrow.right { right: 24px; }
  .zoom-arrow.dimmed { opacity: 0.2; pointer-events: none; }
  .zoom-img {
    width: 78vw; aspect-ratio: 4/3; border-radius: 14px; overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.25s;
  }
  .zoom-dots {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; transition: background 0.2s; }
  .dot.on  { background: #fff; }
  .dot.off { background: rgba(255,255,255,0.28); }

  /* Page note */
  .page-note { font-size: 11px; color: rgba(255,255,255,0.28); text-align: center; }
  .page-note strong { color: rgba(255,255,255,0.48); }
</style>
</head>
<body>
<div class="wrap">

<!-- MODAL -->
<div class="modal">

  <div class="modal-header">
    <div class="modal-header-left">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M2 4.5A2.5 2.5 0 014.5 2h9A2.5 2.5 0 0116 4.5v9a2.5 2.5 0 01-2.5 2.5h-9A2.5 2.5 0 012 13.5v-9z" stroke="#20667E" stroke-width="1.5"/>
        <circle cx="6.5" cy="6.5" r="1" fill="#20667E"/>
        <path d="M2 11.5l4-3 3 2.5 2-1.5 3 2.5" stroke="#20667E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="modal-title">AI Image Editor</span>
    </div>
    <div class="modal-header-right">
      <span class="ai-badge">✦ AI uses: 1 / 2</span>
      <button class="close-btn">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none">
          <path d="M4.5 4.5l9 9M13.5 4.5l-9 9" stroke="#9aa8bc" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="modal-body">

    <!-- Left panel -->
    <div class="panel-left">
      <span class="section-label">Background</span>
      <div id="bgList"></div>
    </div>

    <!-- Right panel -->
    <div class="panel-right">

      <div class="preview-grid">
        <div class="preview-col">
          <span class="preview-col-label before">Before</span>
          <div class="preview-img" id="beforeImg"
               style="background:linear-gradient(135deg,#8dcce2,#1c586d);">
            <svg width="80" height="58" viewBox="0 0 80 58" fill="none">
              <rect x="1" y="1" width="78" height="56" rx="6" fill="rgba(255,255,255,0.15)"/>
              <path d="M1 40l18-13 14 10 12-9 33 21" stroke="rgba(255,255,255,0.55)" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="21" cy="17" r="6" fill="rgba(255,255,255,0.3)"/>
            </svg>
            <div class="expand-hint">Expand</div>
          </div>
        </div>
        <div class="preview-col">
          <span class="preview-col-label after">After</span>
          <div class="preview-img" id="afterImg"
               style="background:linear-gradient(180deg,#2f92b6 0%,#0d3a52 100%);">
            <svg width="80" height="58" viewBox="0 0 80 58" fill="none">
              <rect x="1" y="1" width="78" height="56" rx="6" fill="rgba(255,255,255,0.1)"/>
              <path d="M1 40l18-13 14 10 12-9 33 21" stroke="rgba(255,255,255,0.4)" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="21" cy="17" r="6" fill="rgba(255,255,255,0.2)"/>
            </svg>
            <div class="expand-hint">Expand</div>
          </div>
        </div>
      </div>

      <div class="regen-box">
        <div class="regen-header">
          <span class="regen-title">Regenerate with context</span>
          <button class="regen-trigger" id="regenTrigger">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M2 6.5a4.5 4.5 0 014.5-4.5A4.5 4.5 0 0111 6.5" stroke="#20667E" stroke-width="1.2" stroke-linecap="round"/>
              <path d="M9 4.5l2 2-2 2" stroke="#20667E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Regenerate
          </button>
        </div>
        <div class="regen-body" id="regenBody">
          <textarea class="regen-textarea" id="regenTA" rows="2"
            placeholder='e.g. "Remove double Bimini" or "Clean reflections on hull"'></textarea>
          <button class="regen-apply" id="regenApply">Apply &amp; Regenerate</button>
        </div>
        <p class="regen-hint" id="regenHint">Applies only to this image.</p>
      </div>

    </div>
  </div>

  <div class="modal-footer">
    <button class="btn" id="resetBtn">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M2 6.5a4.5 4.5 0 014.5-4.5A4.5 4.5 0 0111 6.5" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M4 4.5L2 6.5l-2-2" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Reset to original
    </button>
    <button class="btn btn-primary" id="applyBtn">Apply Changes</button>
  </div>

</div>

<!-- ZOOM OVERLAY -->
<div class="zoom-overlay" id="zoomOverlay">

  <div class="zoom-topbar">
    <div class="zoom-pill">
      <button class="zoom-pill-btn zactive" id="zpBefore">Before</button>
      <button class="zoom-pill-btn zinactive" id="zpAfter">After</button>
    </div>
    <span class="zoom-filename">IMG_0042</span>
    <button class="zoom-close" id="zoomClose">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M2 2l9 9M11 2l-9 9" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Close
    </button>
  </div>

  <button class="zoom-arrow left dimmed" id="zoomPrev">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M10 3L6 8l4 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="zoom-img" id="zoomImg"
       style="background:linear-gradient(135deg,#8dcce2,#1c586d);">
    <svg width="160" height="116" viewBox="0 0 80 58" fill="none">
      <rect x="1" y="1" width="78" height="56" rx="6" fill="rgba(255,255,255,0.15)"/>
      <path d="M1 40l18-13 14 10 12-9 33 21" stroke="rgba(255,255,255,0.55)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="21" cy="17" r="6" fill="rgba(255,255,255,0.3)"/>
    </svg>
  </div>

  <button class="zoom-arrow right" id="zoomNext">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M6 3l4 5-4 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="zoom-dots">
    <div class="dot on"  id="dotBefore"></div>
    <div class="dot off" id="dotAfter"></div>
  </div>

</div>

<p class="page-note">
  <strong>Boatyard Sales — AI Image Editor</strong> &nbsp;·&nbsp; UI Prototype &nbsp;·&nbsp; May 2026
</p>

</div>

<script>
const BGS = [
  { id: 0, label: 'Maintain',   swatch: 'background:#fff;border:1px solid #e2ebf3;' },
  { id: 1, label: 'Pure White', swatch: 'background:#f8f9fb;border:1px solid #e2ebf3;' },
  { id: 2, label: 'Studio',     swatch: 'background:linear-gradient(135deg,#b5c3d4,#7b8ba3);' },
  { id: 3, label: 'Open Sea',   swatch: 'background:linear-gradient(135deg,#1c586d,#2f92b6);' },
  { id: 4, label: 'Showroom',   swatch: 'background:linear-gradient(135deg,#9aa8bc,#d3dce8);' },
];

const BEFORE_BG = 'linear-gradient(135deg,#8dcce2,#1c586d)';
const AFTER_BG  = 'linear-gradient(180deg,#2f92b6 0%,#0d3a52 100%)';

let selBg    = 3;
let zoomView = 'before';

function renderBgs() {
  document.getElementById('bgList').innerHTML = BGS.map(bg => `
    <button class="bg-btn ${bg.id === selBg ? 'active' : ''}" data-id="${bg.id}">
      <div class="bg-swatch" style="${bg.swatch}"></div>
      <span class="bg-label">${bg.label}</span>
    </button>`).join('');
  document.querySelectorAll('.bg-btn').forEach(el => {
    el.addEventListener('click', () => { selBg = +el.dataset.id; renderBgs(); });
  });
}

function openZoom(which) {
  zoomView = which;
  document.getElementById('zoomOverlay').style.display = 'flex';
  refreshZoom();
}

function closeZoom() {
  document.getElementById('zoomOverlay').style.display = 'none';
}

function zoomSwitch(which) {
  zoomView = which;
  refreshZoom();
}

function refreshZoom() {
  const isBefore = zoomView === 'before';
  document.getElementById('zoomImg').style.background = isBefore ? BEFORE_BG : AFTER_BG;
  document.getElementById('zpBefore').className = 'zoom-pill-btn ' + (isBefore ? 'zactive' : 'zinactive');
  document.getElementById('zpAfter').className  = 'zoom-pill-btn ' + (isBefore ? 'zinactive' : 'zactive');
  document.getElementById('zoomPrev').classList.toggle('dimmed',  isBefore);
  document.getElementById('zoomNext').classList.toggle('dimmed', !isBefore);
  document.getElementById('dotBefore').className = 'dot ' + (isBefore ? 'on' : 'off');
  document.getElementById('dotAfter').className  = 'dot ' + (isBefore ? 'off' : 'on');
}

function toggleRegen() {
  const body = document.getElementById('regenBody');
  const hint = document.getElementById('regenHint');
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  hint.style.display = open ? 'block' : 'none';
}

function applyRegen() {
  const ta  = document.getElementById('regenTA');
  const btn = document.getElementById('regenApply');
  if (!ta.value.trim()) { ta.style.borderColor = '#f78e1e'; return; }
  ta.style.borderColor = '#d3dce8';
  btn.textContent = 'Regenerating…'; btn.style.background = '#1c586d';
  setTimeout(() => { btn.textContent = 'Apply & Regenerate'; btn.style.background = '#20667E'; }, 1800);
}

function resetOriginal() {
  const btn = document.getElementById('resetBtn');
  btn.style.background = '#e2ebf3';
  setTimeout(() => { btn.style.background = '#f8f9fb'; }, 320);
}

function applyChanges() {
  const btn = document.getElementById('applyBtn');
  btn.textContent = 'Applying…'; btn.style.background = '#1c586d';
  setTimeout(() => { btn.textContent = 'Applied ✓'; btn.style.background = '#1A8962'; }, 800);
  setTimeout(() => { btn.textContent = 'Apply Changes'; btn.style.background = '#20667E'; }, 2500);
}

document.getElementById('beforeImg').addEventListener('click',    () => openZoom('before'));
document.getElementById('afterImg').addEventListener('click',     () => openZoom('after'));
document.getElementById('zoomClose').addEventListener('click',    closeZoom);
document.getElementById('zoomPrev').addEventListener('click',     () => zoomSwitch('before'));
document.getElementById('zoomNext').addEventListener('click',     () => zoomSwitch('after'));
document.getElementById('zpBefore').addEventListener('click',     () => zoomSwitch('before'));
document.getElementById('zpAfter').addEventListener('click',      () => zoomSwitch('after'));
document.getElementById('regenTrigger').addEventListener('click', toggleRegen);
document.getElementById('regenApply').addEventListener('click',   applyRegen);
document.getElementById('resetBtn').addEventListener('click',     resetOriginal);
document.getElementById('applyBtn').addEventListener('click',     applyChanges);

document.addEventListener('keydown', e => {
  if (document.getElementById('zoomOverlay').style.display !== 'flex') return;
  if (e.key === 'ArrowLeft')  zoomSwitch('before');
  if (e.key === 'ArrowRight') zoomSwitch('after');
  if (e.key === 'Escape')     closeZoom();
});

renderBgs();
</script>
</body>
</html>
